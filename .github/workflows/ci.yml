name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  RELEASE_NODE_VERSION: '24.22.3'
  RELEASE_NPM_VERSION: '12.2.2'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
      
      - name: Setup Node.js
        uses: fortify/shared-github/actions/3rdparty/actions/setup-node/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test:unit
      
      - name: Run unit tests with coverage
        run: npm run test:coverage
      
      - name: Upload coverage reports
        uses: fortify/shared-github/actions/3rdparty/codecov/codecov-action/v4@5ad1afec0f56a21b03f0887eea35505cb6a66554
        if: always()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    needs: unit-tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
      
      - name: Setup Node.js
        uses: fortify/shared-github/actions/3rdparty/actions/setup-node/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install publishing npm version
        run: npm install -g "npm@$RELEASE_NPM_VERSION"
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run publish build lifecycle
        run: npm run prepublishOnly
      
      - name: Check CLI runs
        run: node dist/cli.js --help

      - name: Validate release package
        run: npm pack --dry-run
      
      - name: Upload dist artifacts
        uses: fortify/shared-github/actions/3rdparty/actions/upload-artifact/v7@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          name: dist
          path: dist/

  integration-tests:
    name: Integration Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-2022, macos-latest]
    
    steps:
      - name: Checkout code
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
      
      - name: Setup Node.js
        uses: fortify/shared-github/actions/3rdparty/actions/setup-node/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: fortify/shared-github/actions/3rdparty/actions/download-artifact/v8@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          name: dist
          path: dist
      
      - name: Run integration tests
        run: npm run test:integration
      
      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 10

  release-please:
    name: Release Please
    needs: [build, integration-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    
    steps:
      - name: Create Release PR or Publish Release
        uses: fortify/shared-github/actions/3rdparty/googleapis/release-please-action/v5@5ad1afec0f56a21b03f0887eea35505cb6a66554
        id: release
        with:
          release-type: node
          target-branch: ${{ github.ref_name }}
      
      - name: Checkout code (if release created)
        if: ${{ steps.release.outputs.release_created }}
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          ref: ${{ steps.release.outputs.sha }}
      
      - name: Setup Node.js (if release created)
        if: ${{ steps.release.outputs.release_created }}
        uses: fortify/shared-github/actions/3rdparty/actions/setup-node/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      
      - name: Install publishing npm version (if release created)
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g "npm@$RELEASE_NPM_VERSION"

      - name: Install dependencies (if release created)
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci
      
      - name: Build (if release created)
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm publish --provenance --access public --registry https://registry.npmjs.org
          npm view "@fortify/setup@$RELEASE_VERSION" version dist.integrity --json --registry https://registry.npmjs.org
      
      - name: Publish to GitHub Packages
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm config set "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          npm publish --provenance --access public --registry https://npm.pkg.github.com
          npm view "@fortify/setup@$RELEASE_VERSION" version dist.integrity --json --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
      
      - name: Publish summary
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "✓ Published @fortify/setup@${{ steps.release.outputs.version }} to npm"
          echo "✓ Published @fortify/setup@${{ steps.release.outputs.version }} to GitHub Packages"
          
