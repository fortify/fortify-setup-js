name: Fortify on Demand Scan

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '16 0 * * 5'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  FoD-Scan:
    uses: fortify/shared-github/.github/workflows/reusable-fortify-analysis.yml@5ad1afec0f56a21b03f0887eea35505cb6a66554
    with:
      node-version: '20'
    secrets: inherit
